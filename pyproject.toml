[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fit4dstem"
dynamic = ["version"]
description = "4D-STEM CBED maps of ferroelectric superlattices: thickness, tilt, Ti displacement, strain and field by fitting multislice rocking curves; app, NXem export, NOMAD plugin"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Christoph T. Koch" }]
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "matplotlib",
    "scikit-image",
    "ase",
    "ipywidgets>=8",
    "pyyaml",
]

[project.optional-dependencies]
# stand-alone web app (solara run webapp/solara_app.py); solara-assets must match the solara version
web = ["solara==1.58.2", "solara-assets==1.58.2"]
# NXem validation, other input formats
nexus = ["pynxtools>=0.16", "pynxtools-em>=0.4", "rosettasciio"]
# NOMAD plugin (dashboard + ELN schema); nomad-lab itself comes with the NOMAD installation
nomad = ["solara==1.58.2", "solara-assets==1.58.2", "pynxtools>=0.16", "pynxtools-em>=0.4", "nomad-measurements"]
notebooks = ["jupyter", "voila", "nbformat"]
gpu = ["cupy-cuda12x"]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/christophys/fit4DSTEM"

[project.entry-points.'nomad.plugin']
fit4dstem_dashboard = "fit4dstem_nomad.dashboards:fit4dstem_dashboard"
fit4dstem_schema = "fit4dstem_nomad.schema_packages:fourdstem_schema"

[tool.setuptools.dynamic]
version = { attr = "fit4dstem.__version__" }

[tool.setuptools.packages.find]
include = ["fit4dstem", "fit4dstem.*", "fit4dstem_nomad", "fit4dstem_nomad.*"]
